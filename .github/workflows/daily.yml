name: Debug Env

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Edge TTS
        run: |
          pip install edge-tts
          edge-tts --version
      
      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      
      - name: Test variables
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_DEFAULT: ${{ secrets.WHATSAPP_DEFAULT }}
        run: |
          echo "PEXELS_API_KEY existe: ${{ secrets.PEXELS_API_KEY != '' }}"
          echo "Longueur: ${#PEXELS_API_KEY}"
          node server.js
      
      - name: Sauvegarder
        uses: actions/upload-artifact@v4
        with:
          name: debug-video
          path: output/*.mp4
