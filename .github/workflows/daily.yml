name: Test Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      
      - name: Générer vidéo
        run: |
          node server.js
          echo "=== Vérification ==="
          ls -lh output/ || echo "❌ Dossier vide!"
      
      - name: Sauvegarder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-test
          path: output/*.mp4
          if-no-files-found: warn
