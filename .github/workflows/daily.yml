name: Agent Viral Multi-Plateformes

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          
      - name: Installer Edge TTS
        run: |
          pip install edge-tts
          edge-tts --version || echo "Edge TTS installé"
          
      - name: Créer dossier output
        run: mkdir -p output && ls -la
        
      - name: Lancer Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_DEFAULT: ${{ secrets.WHATSAPP_DEFAULT }}
        run: |
          node server.js
          echo "=== Vérification fichiers ==="
          ls -la output/ || echo "Dossier output vide!"
          
      - name: Sauvegarder vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-generees
          path: output/
          retention-days: 7
          if-no-files-found: warn
